<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PetsIoT 控制台</title>
<style>
/* ── Reset & Tokens ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --card:      #20232f;
  --border:    #2c2f3e;
  --accent:    #6c63ff;
  --accent2:   #ff6584;
  --green:     #4ade80;
  --yellow:    #facc15;
  --red:       #f87171;
  --text:      #e8eaf0;
  --muted:     #7b7f96;
  --radius:    14px;
  --shadow:    0 4px 24px rgba(0,0,0,.45);
}
body { background: var(--bg); color: var(--text); font-family: 'Inter', 'PingFang SC', system-ui, sans-serif; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font-family: inherit; }

/* ── Layout ─────────────────────────────────────────────────── */
.app { display: grid; grid-template-rows: 56px 1fr; min-height: 100vh; }

/* ── Nav ─────────────────────────────────────────────────────── */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
}
.nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.nav-brand svg { color: var(--accent); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; }
.userid-tag { font-size: 12px; color: var(--muted); background: var(--card);
  padding: 4px 10px; border-radius: 8px; font-family: monospace; }

/* ── Main ────────────────────────────────────────────────────── */
main { padding: 28px 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

/* ── Setup Card ─────────────────────────────────────────────── */
.setup-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 40px;
  max-width: 480px; margin: 80px auto; text-align: center;
  box-shadow: var(--shadow);
}
.setup-card h2 { font-size: 22px; margin-bottom: 8px; }
.setup-card p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
.input-group { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.input-group label { font-size: 13px; color: var(--muted); font-weight: 500; }
.input-group input {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14px; padding: 11px 14px; width: 100%;
  font-family: monospace;
  transition: border-color .2s;
}
.input-group input:focus { outline: none; border-color: var(--accent); }
.input-group input::placeholder { color: var(--muted); }
.btn-primary {
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 600;
  padding: 12px 28px; width: 100%; margin-top: 16px;
  transition: opacity .2s, transform .1s;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:active { transform: scale(.98); }

/* ── Section Header ─────────────────────────────────────────── */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-header h2 { font-size: 18px; font-weight: 700; }
.btn-sm {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; font-size: 13px; padding: 7px 14px;
  transition: background .2s;
}
.btn-sm:hover { background: var(--border); }

/* ── Device Grid ─────────────────────────────────────────────── */
.device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

/* ── Device Card ─────────────────────────────────────────────── */
.device-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px;
  cursor: pointer; transition: border-color .2s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.device-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)33; }
.device-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent)55; }
.device-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.device-type-u20::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.device-type-u30::before { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
.device-type-u31::before { background: linear-gradient(90deg, #8b5cf6, #ec4899); }

.device-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.device-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; background: var(--surface); }
.device-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green)88; }
.device-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.device-id { font-size: 11px; color: var(--muted); font-family: monospace; }

.device-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat-item { background: var(--surface); border-radius: 9px; padding: 10px 12px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.stat-value { font-size: 20px; font-weight: 700; }
.stat-item.wide { grid-column: span 2; }

.device-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn-action {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; font-size: 13px; font-weight: 500; padding: 8px 14px;
  flex: 1; min-width: 100px; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-action:hover { background: var(--border); }
.btn-action.danger { border-color: var(--red)55; color: var(--red); }
.btn-action.danger:hover { background: var(--red)18; }
.btn-action.primary-action { background: var(--accent)22; border-color: var(--accent)55; color: var(--accent); }
.btn-action.primary-action:hover { background: var(--accent)33; }
.btn-action:disabled { opacity: .4; cursor: not-allowed; }

/* ── Detail Panel ─────────────────────────────────────────────── */
.panel-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.panel-overlay.open { opacity: 1; pointer-events: auto; }
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); width: 100%; max-width: 580px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow);
  transform: translateY(20px); transition: transform .2s;
}
.panel-overlay.open .panel { transform: translateY(0); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.panel-head h3 { font-size: 17px; font-weight: 700; }
.btn-close { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; }
.panel-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

/* ── Setting Row ─────────────────────────────────────────────── */
.setting-group { display: flex; flex-direction: column; gap: 12px; }
.setting-group-title { font-size: 13px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px; }
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border-radius: 10px; padding: 13px 16px;
}
.setting-row-left { display: flex; flex-direction: column; gap: 2px; }
.setting-row-label { font-size: 14px; font-weight: 500; }
.setting-row-desc { font-size: 12px; color: var(--muted); }

/* Toggle */
.toggle { position: relative; width: 44px; height: 24px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 24px; cursor: pointer; transition: background .2s;
}
.toggle input:checked + .toggle-track { background: var(--accent); }
.toggle-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff;
  transition: transform .2s; pointer-events: none;
}
.toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }

/* Select */
.setting-select {
  background: var(--border); border: none; color: var(--text);
  border-radius: 8px; font-size: 13px; padding: 6px 10px; font-family: inherit;
}

/* ── Flow List ────────────────────────────────────────────────── */
.flow-list { display: flex; flex-direction: column; gap: 8px; }
.flow-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border-radius: 10px; padding: 12px 16px;
}
.flow-icon { width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent)22; display: flex; align-items: center;
  justify-content: center; font-size: 16px; flex-shrink: 0; }
.flow-info { flex: 1; }
.flow-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.flow-time { font-size: 11px; color: var(--muted); }
.flow-value { font-size: 14px; font-weight: 700; color: var(--accent); }

/* ── Abnormal Badges ──────────────────────────────────────────── */
.abnormal-list { display: flex; flex-wrap: wrap; gap: 8px; }
.abnormal-badge {
  background: var(--red)22; border: 1px solid var(--red)44;
  color: var(--red); font-size: 12px; border-radius: 6px; padding: 4px 10px;
}
.normal-tag { background: var(--green)22; border: 1px solid var(--green)44;
  color: var(--green); font-size: 12px; border-radius: 6px; padding: 4px 10px; }

/* ── Toast ────────────────────────────────────────────────────── */
.toast-wrap { position: fixed; top: 68px; right: 20px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 18px; font-size: 14px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px;
  animation: slideIn .2s ease;
  max-width: 320px;
}
.toast.success { border-color: var(--green)55; }
.toast.error   { border-color: var(--red)55; }
@keyframes slideIn { from { opacity:0; transform: translateX(30px); } }

/* ── Loading Skeleton ────────────────────────────────────────── */
.skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.skeleton-card { height: 220px; border-radius: var(--radius); }

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width: 600px) {
  main { padding: 16px; }
  .device-grid { grid-template-columns: 1fr; }
  .panel { max-width: 100%; max-height: 100vh; border-radius: 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Nav -->
  <nav>
    <div class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      PetsIoT 控制台
    </div>
    <div class="nav-right">
      <span class="userid-tag" id="nav-userid" style="display:none"></span>
      <button class="btn-sm" id="btn-logout" style="display:none" onclick="logout()">退出</button>
    </div>
  </nav>

  <main id="main-content">
    <!-- 初始设置 -->
    <div class="setup-card" id="setup-view">
      <div style="font-size:48px;margin-bottom:16px">🐾</div>
      <h2>连接你的设备</h2>
      <p>输入你的 UserId 开始管理猫咪设备</p>
      <div class="input-group">
        <label>UserId</label>
        <input type="text" id="input-userid" placeholder="例：abc123def456..." />
        <label style="margin-top:8px">设备列表接口测试</label>
        <div style="font-size:12px;color:var(--muted);background:var(--card);border-radius:8px;padding:10px 12px;font-family:monospace;line-height:1.6">
          UserId 可从微信小程序抓包获得<br>
          或从已修改的源码里打 console.log 拿到
        </div>
      </div>
      <button class="btn-primary" onclick="connect()">连接设备 →</button>
    </div>

    <!-- 设备列表 -->
    <div id="devices-view" style="display:none">
      <div class="section-header">
        <h2>我的设备</h2>
        <button class="btn-sm" onclick="refreshDevices()">🔄 刷新</button>
      </div>
      <div class="device-grid" id="device-grid"></div>
    </div>
  </main>
</div>

<!-- 详情/设置面板 -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel(event)">
  <div class="panel" id="panel">
    <div class="panel-head">
      <h3 id="panel-title">设备详情</h3>
      <button class="btn-close" onclick="closePanel()">×</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ── 全局状态 ────────────────────────────────────────────────────────────────
const state = {
  userId: localStorage.getItem('petsiot_userid') || '',
  devices: [],
  currentDevice: null,
};

// ── 工具 ────────────────────────────────────────────────────────────────────
function toast(msg, type = 'info', icon = '') {
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icon || icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// 设备类型解析
function parseDeviceType(device) {
  const id = (device.DeviceId || '').toLowerCase();
  const name = (device.DeviceName || '').toLowerCase();
  // DeviceType 字段或根据 SN 前缀判断
  if (device.DeviceType) return device.DeviceType.toLowerCase();
  if (name.includes('u20') || id.includes('u20')) return 'u20';
  if (name.includes('u30') || id.includes('u30')) return 'u30';
  if (name.includes('u31') || id.includes('u31')) return 'u31';
  return 'u10';
}

const DEVICE_META = {
  u10: { icon: '🪣', label: '智能猫砂盆',   color: '#6c63ff' },
  u20: { icon: '🍲', label: '智能猫粮机',   color: '#f59e0b' },
  u30: { icon: '💧', label: '猫泉 Pro',     color: '#06b6d4' },
  u31: { icon: '🌊', label: '猫泉 mini',    color: '#8b5cf6' },
};

// U10 清洁状态
const U10_WORK_STATUS = {
  0: '空闲', 1: '初始化中', 16: '清洁中', 17: '清洁暂停', 18: '清洁中',
  32: '匀砂中', 33: '匀砂暂停', 34: '匀砂中',
  48: '倾倒中', 49: '倾倒暂停', 50: '倾倒中',
  64: '掩埋中', 65: '掩埋暂停', 66: '掩埋中',
};

// U10 故障位
const U10_ABNORMAL_BITS = [
  [0,'重量传感器异常'],[1,'顶盖异常'],[2,'感应仓IR异常'],
  [3,'内部IR异常'],[4,'废料仓满'],[5,'废料仓未关闭'],
  [6,'设备未放平'],[7,'硬件锁定'],
];
const U20_ABNORMAL_BITS = [
  [0,'碗未安装'],[1,'料斗未安装'],[2,'料斗空'],[3,'料斗不足'],
];
const U30_ABNORMAL_BITS = [
  [1,'净水箱空'],[2,'污水箱满'],[3,'水碗缺失'],[4,'污水口未插入'],
  [5,'滤芯未激活'],[6,'滤芯过期'],[7,'净水箱浮球异常'],[8,'污水箱浮球异常'],
  [9,'水碗空'],[10,'重量异常'],
];
const U31_ABNORMAL_BITS = [[0,'碗未安装'],[1,'水量不足'],[2,'水泵异常']];

function parseAbnormal(code, bits) {
  if (!code) return [];
  return bits.filter(([bit]) => (code >> bit) & 1).map(([, name]) => name);
}

// ── API 调用 ────────────────────────────────────────────────────────────────
const BASE = '/api';

async function apiFetch(path, opts = {}) {
  const r = await fetch(BASE + path, {
    headers: { 'content-type': 'application/json' },
    ...opts,
  });
  return r.json();
}

async function getDevices() {
  return apiFetch(`/devices?userid=${encodeURIComponent(state.userId)}`);
}

async function getFlowInfo(type, thingid) {
  return apiFetch(`/flowinfo?type=${type}&userid=${encodeURIComponent(state.userId)}&thingid=${encodeURIComponent(thingid)}`);
}

async function getSetInfo(type, thingid) {
  return apiFetch(`/setinfo?type=${type}&thingid=${encodeURIComponent(thingid)}`);
}

async function sendCommand(type, method, param) {
  return apiFetch('/command', {
    method: 'POST',
    body: JSON.stringify({ type, method, param }),
  });
}

// ── 认证 ────────────────────────────────────────────────────────────────────
function connect() {
  const uid = document.getElementById('input-userid').value.trim();
  if (!uid) { toast('请输入 UserId', 'error'); return; }
  state.userId = uid;
  localStorage.setItem('petsiot_userid', uid);
  showDevicesView();
}

function logout() {
  state.userId = '';
  localStorage.removeItem('petsiot_userid');
  document.getElementById('setup-view').style.display = '';
  document.getElementById('devices-view').style.display = 'none';
  document.getElementById('nav-userid').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'none';
}

// ── 设备列表 ─────────────────────────────────────────────────────────────────
async function showDevicesView() {
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('devices-view').style.display = '';
  const nav = document.getElementById('nav-userid');
  nav.textContent = state.userId.slice(0, 12) + '…';
  nav.style.display = '';
  document.getElementById('btn-logout').style.display = '';
  await refreshDevices();
}

async function refreshDevices() {
  const grid = document.getElementById('device-grid');
  // 骨架屏
  grid.innerHTML = [1,2,3].map(() => `<div class="skeleton skeleton-card"></div>`).join('');
  try {
    const data = await getDevices();
    if (!data || data.code !== 0) {
      grid.innerHTML = `<div style="color:var(--muted);padding:40px;text-align:center">暂无设备，或 UserId 有误</div>`;
      return;
    }
    state.devices = Array.isArray(data.info) ? data.info : [];
    grid.innerHTML = '';
    if (!state.devices.length) {
      grid.innerHTML = `<div style="color:var(--muted);padding:40px;text-align:center">该账号下暂无设备</div>`;
      return;
    }
    state.devices.forEach(d => grid.appendChild(buildDeviceCard(d)));
  } catch(e) {
    grid.innerHTML = `<div style="color:var(--red);padding:40px;text-align:center">加载失败：${e.message}</div>`;
    toast('加载设备列表失败', 'error');
  }
}

function buildDeviceCard(device) {
  const type = parseDeviceType(device);
  const meta = DEVICE_META[type] || DEVICE_META.u10;
  const isOnline = !!device.DeviceIsOnline;
  const abnormalBits = { u10: U10_ABNORMAL_BITS, u20: U20_ABNORMAL_BITS, u30: U30_ABNORMAL_BITS, u31: U31_ABNORMAL_BITS }[type] || [];
  const abnormals = parseAbnormal(device.DeviceAbnormalInfo, abnormalBits);

  // 统计数据
  const stats = buildStats(type, device);

  const card = document.createElement('div');
  card.className = `device-card device-type-${type}`;
  card.innerHTML = `
    <div class="device-header">
      <div class="device-icon">${meta.icon}</div>
      <div class="device-status">
        <span class="status-dot ${isOnline ? 'online' : ''}"></span>
        <span style="color:${isOnline ? 'var(--green)' : 'var(--muted)'}">${isOnline ? '在线' : '离线'}</span>
      </div>
    </div>
    <div class="device-name">${device.DeviceName || '未命名设备'}</div>
    <div class="device-id">${(device.DeviceId||'').slice(0,16)}…</div>
    ${abnormals.length ? `<div style="margin-top:10px">
      <div class="abnormal-list">${abnormals.map(a=>`<span class="abnormal-badge">⚠️ ${a}</span>`).join('')}</div>
    </div>` : ''}
    <div class="device-stats">${stats}</div>
    <div class="device-actions">${buildActions(type, device)}</div>
  `;
  return card;
}

function buildStats(type, d) {
  if (type === 'u10') return `
    <div class="stat-item"><div class="stat-label">今日进入次数</div><div class="stat-value">${d.TodayCatIn ?? '—'}</div></div>
    <div class="stat-item"><div class="stat-label">今日清洁次数</div><div class="stat-value">${d.TodayClean ?? '—'}</div></div>
    <div class="stat-item wide"><div class="stat-label">工作状态</div><div class="stat-value" style="font-size:15px">${U10_WORK_STATUS[d.DeviceWorkStatus] || '未知'}</div></div>
  `;
  if (type === 'u20') return `
    <div class="stat-item"><div class="stat-label">今日喂食次数</div><div class="stat-value">${d.TodayCatFeed ?? '—'}</div></div>
    <div class="stat-item"><div class="stat-label">今日进食次数</div><div class="stat-value">${d.TodayCatEat ?? '—'}</div></div>
    <div class="stat-item wide"><div class="stat-label">碗内余粮</div><div class="stat-value">${d.BowlFoodWeight != null ? d.BowlFoodWeight + ' g' : '—'}</div></div>
  `;
  if (type === 'u30' || type === 'u31') return `
    <div class="stat-item wide"><div class="stat-label">今日饮水次数</div><div class="stat-value">${d.TodayCatDrink ?? '—'}</div></div>
  `;
  return '';
}

function buildActions(type, device) {
  const uid = state.userId;
  const tid = device.DeviceId;
  if (type === 'u10') return `
    <button class="btn-action primary-action" onclick="cmdU10Clean(event,'${tid}','${uid}')">🧹 远程清洁</button>
    <button class="btn-action" onclick="openDevicePanel(event,'${tid}')">⚙️ 设置</button>
    <button class="btn-action" onclick="openFlowPanel(event,'u10','${tid}')">📊 记录</button>
  `;
  if (type === 'u20') return `
    <button class="btn-action primary-action" onclick="openFeedPanel(event,'${tid}','${uid}')">🍲 远程出粮</button>
    <button class="btn-action" onclick="openDevicePanel(event,'${tid}')">⚙️ 设置</button>
    <button class="btn-action" onclick="openFlowPanel(event,'u20','${tid}')">📊 记录</button>
  `;
  if (type === 'u30') return `
    <button class="btn-action primary-action" onclick="cmdU30Clean(event,'${tid}','${uid}')">💧 远程清洗</button>
    <button class="btn-action" onclick="openDevicePanel(event,'${tid}')">⚙️ 设置</button>
    <button class="btn-action" onclick="openFlowPanel(event,'u30','${tid}')">📊 记录</button>
  `;
  if (type === 'u31') return `
    <button class="btn-action" onclick="openDevicePanel(event,'${tid}')">⚙️ 设置</button>
    <button class="btn-action" onclick="openFlowPanel(event,'u31','${tid}')">📊 记录</button>
  `;
  return '';
}

// ── 设备指令 ─────────────────────────────────────────────────────────────────
async function cmdU10Clean(e, thingid, userid) {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const ts = Date.now();
    const res = await sendCommand('u10', 'CommandClean', {
      userid, thingid, commandid: userid + ts
    });
    if (res && res.code === 0) toast('清洁指令已发送', 'success');
    else toast('指令失败：' + JSON.stringify(res), 'error');
  } catch { toast('网络错误', 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '🧹 远程清洁'; }
}

async function cmdU30Clean(e, thingid, userid) {
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const ts = Date.now();
    const res = await sendCommand('u30', '/command/clean', {
      userid, thingid, content: '', commandid: userid + ts
    });
    if (res && res.code === 0) toast('清洗指令已发送', 'success');
    else toast('指令失败：' + JSON.stringify(res), 'error');
  } catch { toast('网络错误', 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '💧 远程清洗'; }
}

// ── 出粮面板 ─────────────────────────────────────────────────────────────────
function openFeedPanel(e, thingid, userid) {
  e.stopPropagation();
  openPanel('远程出粮', `
    <div class="setting-group">
      <div class="setting-group-title">出粮量设置</div>
      <div class="setting-row">
        <div class="setting-row-left">
          <div class="setting-row-label">出粮克数</div>
          <div class="setting-row-desc">建议 5–50g</div>
        </div>
        <input type="number" id="feed-weight" value="10" min="5" max="100"
          style="width:80px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:15px;text-align:center">
      </div>
    </div>
    <button class="btn-primary" onclick="doFeed('${thingid}','${userid}')">🍲 立即出粮</button>
  `);
}

async function doFeed(thingid, userid) {
  const w = parseInt(document.getElementById('feed-weight').value) || 10;
  const ts = Date.now();
  try {
    const res = await sendCommand('u20', '/command/dispenseForce', {
      userid, thingid, content: JSON.stringify({ weight: w })
    });
    if (res && res.code === 0) { toast(`已出粮 ${w}g`, 'success'); closePanel(); }
    else toast('指令失败：' + JSON.stringify(res), 'error');
  } catch { toast('网络错误', 'error'); }
}

// ── 流水记录面板 ──────────────────────────────────────────────────────────────
async function openFlowPanel(e, type, thingid) {
  e.stopPropagation();
  const titles = { u10: '猫砂盆记录', u20: '猫粮机记录', u30: '猫泉Pro记录', u31: '猫泉mini记录' };
  openPanel(titles[type] || '使用记录', `<div style="color:var(--muted);text-align:center;padding:20px">加载中…</div>`);
  try {
    const data = await getFlowInfo(type, thingid);
    const list = (data && data.code === 0 && Array.isArray(data.info)) ? data.info : [];
    const icons = { 1: '🐱', 2: '🔄' };
    const html = list.length === 0
      ? `<div style="color:var(--muted);text-align:center;padding:30px">今日暂无记录</div>`
      : `<div class="flow-list">${list.map(item => {
          const d = new Date(item.StartTime * 1000);
          const time = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
          const typeLabel = item.Type === 1 ? (type === 'u20' ? '进食' : type === 'u30' || type === 'u31' ? '饮水' : '进入') : '清洁';
          const val = item.Weight ? item.Weight + 'g' : (item.EndTime ? Math.round((item.EndTime - item.StartTime)) + 's' : '');
          return `<div class="flow-item">
            <div class="flow-icon">${icons[item.Type] || '📋'}</div>
            <div class="flow-info">
              <div class="flow-title">${typeLabel}</div>
              <div class="flow-time">${time}</div>
            </div>
            ${val ? `<div class="flow-value">${val}</div>` : ''}
          </div>`;
        }).join('')}</div>`;
    document.getElementById('panel-body').innerHTML = html;
  } catch(err) {
    document.getElementById('panel-body').innerHTML = `<div style="color:var(--red)">加载失败：${err.message}</div>`;
  }
}

// ── 设备设置面板 ──────────────────────────────────────────────────────────────
async function openDevicePanel(e, thingid) {
  e.stopPropagation();
  const device = state.devices.find(d => d.DeviceId === thingid);
  if (!device) return;
  const type = parseDeviceType(device);
  const titles = { u10: '猫砂盆设置', u20: '猫粮机设置', u30: '猫泉Pro设置', u31: '猫泉mini设置' };
  openPanel(titles[type] || '设备设置', `<div style="color:var(--muted);text-align:center;padding:20px">加载中…</div>`);
  try {
    const data = await getSetInfo(type, thingid);
    const info = (data && data.code === 0) ? (data.info || data.param || {}) : {};
    document.getElementById('panel-body').innerHTML = buildSettingsPanel(type, device, info);
  } catch {
    document.getElementById('panel-body').innerHTML = buildSettingsPanel(type, device, {});
  }
}

function buildSettingsPanel(type, device, info) {
  const tid = device.DeviceId;
  const uid = state.userId;
  const ts = () => Date.now();
  const cid = () => uid + Date.now();

  if (type === 'u10') return `
    <div class="setting-group">
      <div class="setting-group-title">基础功能</div>
      ${toggleRow('自动盖盖', '猫咪离开后自动关盖', 'AutoCover', info.AutoCover === 1, `settingU10('SetAutoCover','${tid}','${uid}')`)}
      ${toggleRow('负离子杀菌', 'O3 自动净化', 'O3Status', info.O3Status === 1, `settingU10('SetO3Status','${tid}','${uid}')`)}
      ${toggleRow('童锁', '防止误操作', 'ChildLock', info.ChildLock === 1, `settingU10('SetChildLock','${tid}','${uid}')`)}
    </div>
    <div class="setting-group">
      <div class="setting-group-title">清洁模式</div>
      <div class="setting-row">
        <div class="setting-row-left">
          <div class="setting-row-label">清洁模式</div>
          <div class="setting-row-desc">手动 / 自动感应 / 定时</div>
        </div>
        <select class="setting-select" onchange="settingU10CleanMode('${tid}','${uid}',this.value)">
          <option value="1" ${info.CleanMode===1?'selected':''}>手动</option>
          <option value="2" ${info.CleanMode===2?'selected':''}>自动感应</option>
          <option value="3" ${info.CleanMode===3?'selected':''}>定时</option>
        </select>
      </div>
      <div class="setting-row">
        <div class="setting-row-left">
          <div class="setting-row-label">猫砂类型</div>
        </div>
        <select class="setting-select" onchange="settingU10SandMode('${tid}','${uid}',this.value)">
          <option value="1" ${info.SandMode===1?'selected':''}>膨润土</option>
          <option value="2" ${info.SandMode===2?'selected':''}>混合砂</option>
        </select>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-group-title">传感器容错</div>
      ${toggleRow('忽略重量传感', '重量传感器异常时仍运行', 'IgnoreWeight', info.IgnoreWeight === 1, `settingU10('SetIgnoreWeight','${tid}','${uid}')`)}
      ${toggleRow('忽略仓满检测', '废料仓满时仍运行', 'IgnoreBoxFull', info.IgnoreBoxFull === 1, `settingU10('SetIgnoreBoxFull','${tid}','${uid}')`)}
    </div>
    <div class="setting-group">
      <div class="setting-group-title">危险操作</div>
      <button class="btn-action danger" style="width:100%" onclick="cmdU10ForceClean('${tid}','${uid}')">⚠️ 强制清洁</button>
      <button class="btn-action danger" style="width:100%" onclick="cmdReboot('u10','${tid}','${uid}')">🔁 重启设备</button>
    </div>
  `;

  if (type === 'u20') return `
    <div class="setting-group">
      <div class="setting-group-title">提示音设置</div>
      ${toggleRow('提示音', '开启/关闭蜂鸣', 'BuzzerStatus', info.buzzer?.status === 1, `settingU20Buzzer('${tid}','${uid}')`)}
    </div>
    <div class="setting-group">
      <div class="setting-group-title">指示灯设置</div>
      <div class="setting-row">
        <div class="setting-row-left">
          <div class="setting-row-label">灯光模式</div>
        </div>
        <select class="setting-select" onchange="settingU20Lamp('${tid}','${uid}',this.value)">
          <option value="1">常亮</option>
          <option value="2">关闭</option>
        </select>
      </div>
    </div>
  `;

  if (type === 'u30') return `
    <div class="setting-group">
      <div class="setting-group-title">基础功能</div>
      ${toggleRow('童锁', '防止误操作', 'lockStatus', info.lockStatus === 1, `settingU30Lock('${tid}','${uid}')`)}
    </div>
    <div class="setting-group">
      <div class="setting-group-title">循环模式</div>
      <div class="setting-row">
        <div class="setting-row-left"><div class="setting-row-label">水循环模式</div></div>
        <select class="setting-select" onchange="settingU30Cycle('${tid}','${uid}',this.value)">
          <option value="1">持续循环</option>
          <option value="2">间歇循环</option>
        </select>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-group-title">危险操作</div>
      <button class="btn-action danger" style="width:100%" onclick="cmdU30CleanFull('${tid}','${uid}')">💧 远程清洗</button>
    </div>
  `;

  if (type === 'u31') return `
    <div class="setting-group">
      <div class="setting-group-title">基础功能</div>
      ${toggleRow('童锁', '防止误操作', 'lockStatus', false, `settingU31Lock('${tid}','${uid}')`)}
    </div>
  `;

  return `<div style="color:var(--muted)">暂无设置项</div>`;
}

function toggleRow(label, desc, key, checked, onchange) {
  return `<div class="setting-row">
    <div class="setting-row-left">
      <div class="setting-row-label">${label}</div>
      <div class="setting-row-desc">${desc}</div>
    </div>
    <label class="toggle">
      <input type="checkbox" ${checked ? 'checked' : ''} id="toggle-${key}" onchange="${onchange}(this)">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>`;
}

// ── 设置指令封装 ──────────────────────────────────────────────────────────────
async function settingU10(method, thingid, userid, el) {
  const key = method.replace('Set', '');
  const cb = el || document.getElementById(`toggle-${key}`);
  const status = (cb && cb.checked) ? 1 : 2;
  const ts = Date.now();
  try {
    const res = await sendCommand('u10', method, { userid, thingid, status, commandid: userid + ts });
    if (res && res.code === 0) toast('设置已保存', 'success');
    else toast('设置失败', 'error');
  } catch { toast('网络错误', 'error'); }
}

async function settingU10CleanMode(thingid, userid, mode) {
  const ts = Date.now();
  const res = await sendCommand('u10', 'SetCleanMode', {
    mode: parseInt(mode), autoSecond: 300, userid, thingid, commandid: userid + ts
  });
  toast(res?.code === 0 ? '清洁模式已设置' : '设置失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU10SandMode(thingid, userid, mode) {
  const ts = Date.now();
  const res = await sendCommand('u10', 'SetSandMode', {
    mode: parseInt(mode), userid, thingid, commandid: userid + ts
  });
  toast(res?.code === 0 ? '砂型已设置' : '设置失败', res?.code === 0 ? 'success' : 'error');
}

async function cmdU10ForceClean(thingid, userid) {
  if (!confirm('强制清洁不检查安全传感器，确认执行？')) return;
  const ts = Date.now();
  const res = await sendCommand('u10', 'CommandForceClean', { userid, thingid, commandid: userid + ts });
  toast(res?.code === 0 ? '强制清洁指令已发送' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function cmdReboot(type, thingid, userid) {
  if (!confirm('确认重启设备？')) return;
  const ts = Date.now();
  const res = await sendCommand(type, 'CommandReboot', { userid, thingid, commandid: userid + ts });
  toast(res?.code === 0 ? '重启指令已发送' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU20Buzzer(thingid, userid, el) {
  const status = el.checked ? 1 : 2;
  const res = await sendCommand('u20', '/setting/buzzer/set', {
    userid, thingid,
    content: JSON.stringify({ status, startHour:0, startMinute:0, endHour:23, endMinute:59 }),
    commandid: userid + Date.now()
  });
  toast(res?.code === 0 ? '提示音设置已保存' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU20Lamp(thingid, userid, mode) {
  const res = await sendCommand('u20', '/setting/pilotLamp/set', {
    userid, thingid,
    content: JSON.stringify({ mode: parseInt(mode), startHour:0, startMinute:0, endHour:23, endMinute:59, durationTs:60 }),
    commandid: userid + Date.now()
  });
  toast(res?.code === 0 ? '指示灯设置已保存' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU30Lock(thingid, userid, el) {
  const action = el.checked ? 1 : 2;
  const res = await sendCommand('u30', '/setting/lock/set', {
    userid, thingid,
    content: JSON.stringify({ action }),
    commandid: userid + Date.now()
  });
  toast(res?.code === 0 ? '童锁设置已保存' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU30Cycle(thingid, userid, mode) {
  const res = await sendCommand('u30', '/setting/cycle/set', {
    userid, thingid,
    content: JSON.stringify({ mode: parseInt(mode) }),
    commandid: userid + Date.now()
  });
  toast(res?.code === 0 ? '循环模式已保存' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function cmdU30CleanFull(thingid, userid) {
  const ts = Date.now();
  const res = await sendCommand('u30', '/command/clean', { userid, thingid, content: '', commandid: userid + ts });
  toast(res?.code === 0 ? '清洗指令已发送' : '失败', res?.code === 0 ? 'success' : 'error');
}

async function settingU31Lock(thingid, userid, el) {
  const lockStatus = el.checked ? 1 : 2;
  const res = await sendCommand('u31', '/properties/set', {
    userid, thingid,
    content: JSON.stringify({ properties: { lockStatus } }),
    commandid: userid + Date.now()
  });
  toast(res?.code === 0 ? '设置已保存' : '失败', res?.code === 0 ? 'success' : 'error');
}

// ── 面板工具 ─────────────────────────────────────────────────────────────────
function openPanel(title, html) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-body').innerHTML = html;
  document.getElementById('panel-overlay').classList.add('open');
}

function closePanel(e) {
  if (e && e.target !== document.getElementById('panel-overlay')) return;
  document.getElementById('panel-overlay').classList.remove('open');
}

// ── 启动 ─────────────────────────────────────────────────────────────────────
if (state.userId) {
  showDevicesView();
} else {
  document.getElementById('input-userid').focus();
}
</script>
